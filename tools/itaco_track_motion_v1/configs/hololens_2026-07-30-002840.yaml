schema_version: "1.0"

runtime:
  random_seed: 0
  opencv_num_threads: 1

dataset:
  name: hololens_drawer_stage1_trial
  adapter: hololens_pinhole_v1
  source_root: /workspace_whz/data/upload/2026-07-30-002840
  pinhole_root: /workspace_whz/data/upload/2026-07-30-002840/pinhole_projection
  processing_view_manifest_path: /workspace_whz/data/output/itaco_hololens_gt/2026-07-30-002840_revolute_interior_001/inputs/interaction_forward_177_213/frame_mapping.json
  rgb_index_path: /workspace_whz/data/upload/2026-07-30-002840/pinhole_projection/rgb.txt
  depth_index_path: /workspace_whz/data/upload/2026-07-30-002840/pinhole_projection/depth.txt
  odometry_path: /workspace_whz/data/upload/2026-07-30-002840/pinhole_projection/odometry.log
  intrinsics_path: /workspace_whz/data/upload/2026-07-30-002840/pinhole_projection/calibration.txt
  pose_source: hololens_device_odometry_initialization_not_ground_truth
  hand_mask_dir: /workspace_whz/data/output/itaco_hololens_gt/2026-07-30-002840_revolute_interior_001/preprocess/hand_per_frame/mask
  hand_mask_glob: "*.npy"
  autoseg_dir: /workspace_whz/data/output/itaco_hololens_gt/2026-07-30-002840_revolute_interior_001/preprocess/video_segment_reverse/small/final-output
  autoseg_glob: "*.npz"
  autoseg_order: reverse_processing
  depth_confidence_dir: null

known_motion:
  type: prismatic
  axis_path: /workspace_whz/data/output/itaco_hololens_gt/2026-07-30-002840_revolute_interior_001/corrected/rgb_depth_valid_eroded3_gt_axis/refinement_gt_fixed_camera_gt_axis_rgb_depth_valid/monst3r/chamfer/0/prismatic/joint_axis.npy
  state_path: /workspace_whz/data/output/itaco_hololens_gt/2026-07-30-002840_revolute_interior_001/corrected/rgb_depth_valid_eroded3_gt_axis/refinement_gt_fixed_camera_gt_axis_rgb_depth_valid/monst3r/chamfer/0/prismatic/joint_value.npy
  canonicalization_sign: 1.0
  provenance: historical_oracle_axis_diagnostic_used_as_fixed_stage1_input

reference_selection:
  timestamp_scale_seconds: 1.0e-7
  identity_tolerance: 1.0e-8
  max_hand_fraction: 0.12
  min_valid_depth_fraction: 0.18
  min_static_valid_fraction: 0.12
  max_camera_speed_mps: 1.5
  max_camera_angular_speed_radps: 3.0
  min_laplacian_variance: 12.0
  min_tracking_quality: 0.35
  require_pre_action: true
  pre_action_baseline_fraction: 0.2
  pre_action_max_state_delta: 0.025
  pre_action_max_range_fraction: 0.08
  weights:
    hand: 1.5
    depth: 1.0
    static: 1.3
    linear_speed: 0.8
    angular_speed: 0.5
    blur: 0.8
    tracking: 1.0
    before_action: 1.5
  tracking_probe:
    max_corners: 300
    quality_level: 0.01
    min_distance_px: 5.0
    fb_max_error_px: 1.5

validity:
  depth_scale_to_m: 0.001
  depth_min_m: 0.2
  depth_max_m: 4.0
  pose_matrix_tolerance: 1.0e-5
  rgb_min_intensity: 2
  rgb_close_radius_px: 3
  rgb_keep_largest_component: true
  depth_confidence_fallback: 1.0
  min_depth_confidence: 0.5
  depth_boundary_erosion_px: 3.0
  frame_max_hand_fraction: 0.12
  frame_min_tracking_fraction: 0.08
  frame_min_geometry_fraction: 0.10
  frame_min_joint_fraction: 0.08
  dense_fb:
    pyr_scale: 0.5
    levels: 3
    winsize: 15
    iterations: 3
    poly_n: 5
    poly_sigma: 1.2
    max_error_px: 1.5

proposals:
  min_area_px: 40
  legacy_default_score: 0.5
  association_min_score: 0.18
  iou_weight: 0.8
  centroid_weight: 0.2
  centroid_scale_px: 50.0

tracking:
  max_total_tracks: 12000
  max_new_features_per_frame: 500
  quality_level: 0.008
  min_feature_distance_px: 4.0
  block_size_px: 5
  active_exclusion_radius_px: 4
  lk_window_px: 21
  lk_max_level: 3
  lk_iterations: 30
  lk_epsilon: 0.01
  fb_max_error_px: 1.25
  fb_confidence_scale_px: 0.75
  lk_error_scale: 20.0
  min_boundary_distance_px: 3.0
  depth_uncertainty_patch_radius_px: 2
  min_observations: 5
  min_temporal_span_frames: 5

clustering:
  voxel_size_m: 0.04
  max_tracks_per_cluster: 24

classification:
  residual_sigma_floor_m: 0.003
  bic_temperature: 12.0
  min_valid_observations: 5
  min_coverage: 0.55
  min_abs_delta_bic: 5.0
  max_absolute_rmse_m: 0.05
  min_median_depth_confidence: 0.30
  max_median_depth_uncertainty_m: 0.035
  max_known_moving_rmse_m: 0.035
  min_moving_proposal_support: 0.50
  max_occlusion_rate: 0.45
  max_boundary_failure_rate: 0.45
  min_motion_excitation: 0.025
  unknown_probability_floor_on_failure: 0.75
  unknown_probability_without_failure: 0.05
  unknown_reason_temperature: 0.7
  label_posterior_threshold: 0.55

visualization:
  overlay_alpha: 0.58
  track_point_radius_px: 2
  reference_plot_width_px: 900
  reference_plot_row_height_px: 22
  colors_rgb:
    hand: [255, 170, 0]
    invalid: [180, 0, 180]
    valid: [0, 190, 80]
    static: [40, 220, 80]
    moving: [240, 60, 60]
    unknown: [255, 210, 40]
    reference_selected: [40, 220, 80]
    reference_accepted: [60, 130, 240]
    reference_rejected: [130, 130, 130]
